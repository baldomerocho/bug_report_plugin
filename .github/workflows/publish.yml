name: Publicar en pub.dev

# Publicación automática por tag. pub.dev tiene habilitado "Publishing from
# GitHub Actions" para baldomerocho/bug_report_plugin con el patrón v{{version}}.
#
# Se usa el workflow reutilizable oficial de dart-lang: su acción setup-dart es
# la que pide el token OIDC de GitHub y lo deja configurado para pub (el cliente
# de pub no lo hace solo: sin ese paso cae al login por navegador y se cuelga).
# También instala el SDK de Flutter, necesario para paquetes Flutter como este,
# hace un dry-run y publica con `dart pub publish -f`.
#
# Flujo: subir `version:` en pubspec.yaml y CHANGELOG.md, commit en master,
# `git tag vX.Y.Z && git push origin vX.Y.Z`. La versión del tag debe
# coincidir con la de pubspec.yaml o pub.dev rechaza la subida.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    permissions:
      id-token: write # requerido para la autenticación OIDC con pub.dev
      contents: read
