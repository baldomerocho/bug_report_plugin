name: Publicar en pub.dev

# Publicación automática por tag. pub.dev tiene habilitado "Publishing from
# GitHub Actions" para baldomerocho/bug_report_plugin con el patrón v{{version}}:
# al empujar un tag vX.Y.Z, pub.dev acepta la subida con el token OIDC del job
# (sin secretos). La versión del tag debe coincidir con la de pubspec.yaml.
#
# Flujo: subir `version:` en pubspec.yaml y CHANGELOG.md, commit en master,
# `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requerido para la autenticación OIDC con pub.dev
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar que el tag coincide con pubspec.yaml
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version=$(grep -oE '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::El tag v$tag_version no coincide con pubspec.yaml ($pubspec_version)."
            exit 1
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar y probar
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Publicar
        run: flutter pub publish --force
