name: CI

# Gate del paquete: en cada PR y en cada push a master se instalan dependencias,
# se analiza el código y se corren las pruebas. También valida que el paquete
# sea publicable (dry-run), para no descubrirlo al etiquetar.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Estado de git antes del dry-run
        # El dry-run avisa si hay archivos versionados modificados en el runner.
        run: |
          git status --porcelain
          git diff

      - name: Validar publicación (dry-run)
        run: flutter pub publish --dry-run
